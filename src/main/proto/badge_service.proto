syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.hiku.grpc.badge";
option java_outer_classname = "BadgeServiceProto";

package badge;

service BadgeService {
  rpc GetUserBadgeCount(BadgeRequest) returns (BadgeResponse);
}

message BadgeRequest {
  int32 user_id = 1;
  int32 month = 2;  // 1-12
  int32 year = 3;
}

message BadgeResponse {
  int32 user_id = 1;
  int32 badge_count = 2;
  bool found = 3;
}
